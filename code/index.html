<!DOCTYPE html>
<html>

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Forca Animal</title>

        <link rel="stylesheet" href="./assets/css/styles.css">
    </head>

    <div id="modal-como-jogar" class="modal">
        <div class="modal-conteudo">
            <button id="fechar-modal" class="fechar-modal">×</button>

            <h2>Como jogar</h2>

            <p>
                Escolha uma letra por vez e tente descobrir o animal
                antes de completar 6 erros.
            </p>

            <p>
                A cada rodada, os jogadores se alternam.
            </p>

            <p>
                Quem descobrir a palavra ganha 1 ponto.
            </p>
        </div>
    </div>

    <body>
        <main class="game">

            <h1>Forca Animal</h1>

            <section class="placar">
                <p>
                    Jogador 1:
                    <span id="pontos-jogador-1">0</span>
                </p>

                <p>
                    Jogador 2:
                    <span id="pontos-jogador-2">0</span>
                </p>
            </section>

            <section class="rodada">
                <h2 id="jogador-atual">Vez do Jogador 1</h2>
            </section>

            <section class="forca">
                <svg id="desenho-forca" width="220" height="250" viewBox="0 0 220 250">

                    <!-- Estrutura da forca -->
                    <line x1="30" y1="230" x2="190" y2="230" class="estrutura-forca" />
                    <line x1="60" y1="230" x2="60" y2="20" class="estrutura-forca" />
                    <line x1="60" y1="20" x2="150" y2="20" class="estrutura-forca" />
                    <line x1="150" y1="20" x2="150" y2="50" class="estrutura-forca" />

                    <!-- Corpo -->
                    <g id="boneco">

                    <circle id="cabeca"
                            cx="150"
                            cy="70"
                            r="20"
                            class="parte-corpo" />

                    <line id="corpo"
                        x1="150" y1="90"
                        x2="150" y2="150"
                        class="parte-corpo" />

                    <line id="braco-esquerdo"
                        x1="150" y1="105"
                        x2="120" y2="130"
                        class="parte-corpo" />

                    <line id="braco-direito"
                        x1="150" y1="105"
                        x2="180" y2="130"
                        class="parte-corpo" />

                    <line id="perna-esquerda"
                        x1="150" y1="150"
                        x2="125" y2="190"
                        class="parte-corpo" />

                    <line id="perna-direita"
                        x1="150" y1="150"
                        x2="175" y2="190"
                        class="parte-corpo" />

                    <!-- Olho esquerdo em X -->
                    <g id="olho-x-esquerdo" class="olhos-morto">
                        <line x1="139" y1="64" x2="145" y2="70" />
                        <line x1="145" y1="64" x2="139" y2="70" />
                    </g>

                    <!-- Olho direito em X -->
                    <g id="olho-x-direito" class="olhos-morto">
                        <line x1="155" y1="64" x2="161" y2="70" />
                        <line x1="161" y1="64" x2="155" y2="70" />
                    </g>

                </g>

                </svg>
            </section>

            <section class="palavra">
                <p id="palavra-secreta">
                    _ _ _ _ _ _
                </p>
            </section>

            <section class="informacoes">
                <p>
                    Erros:
                    <span id="quantidade-erros">0</span>/6
                </p>

                <p>
                    Letras erradas:
                    <span id="letras-erradas">Nenhuma</span>
                </p>
            </section>

            <section class="teclado">
                <button type="button">A</button>
                <button type="button">B</button>
                <button type="button">C</button>
                <button type="button">D</button>
                <button type="button">E</button>
                <button type="button">F</button>
                <button type="button">G</button>
                <button type="button">H</button>
                <button type="button">I</button>
                <button type="button">J</button>
                <button type="button">K</button>
                <button type="button">L</button>
                <button type="button">M</button>
                <button type="button">N</button>
                <button type="button">O</button>
                <button type="button">P</button>
                <button type="button">Q</button>
                <button type="button">R</button>
                <button type="button">S</button>
                <button type="button">T</button>
                <button type="button">U</button>
                <button type="button">V</button>
                <button type="button">W</button>
                <button type="button">X</button>
                <button type="button">Y</button>
                <button type="button">Z</button>
            </section>

            <section class="resultado">
                <p id="mensagem-resultado"></p>

                <p id="palavra-revelada"></p>
            </section>
            
            <section class="controles">
                <button id="botao-proxima-rodada" type="button" style="display: none;">
                    Próxima rodada
                </button>

                <button id="botao-reiniciar" type="button">
                    Reiniciar jogo
                </button>

                <button id="como-jogar" type="button">
                    Como jogar
                </button>
            </section>

        </main>

        <script src="./assets/js/script.js"></script>

    </body>
</html>
